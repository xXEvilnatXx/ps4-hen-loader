<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 HEN LOADER</title>
<style>
  * { box-sizing: border-box; }
  html, body { 
    margin: 0; 
    padding: 0; 
    background: radial-gradient(circle at center, #161e29 0%, #0d121a 100%); 
    color: #cbd5e1;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; 
    height: 100%; 
  }
  
  /* Professional and modern header */
  #brand { 
    text-align: center; 
    padding: 16px 20px; 
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  #brand::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    background-color: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 8px #34d399;
  }

  #brand b { 
    font-size: 14px; 
    font-weight: 700; 
    letter-spacing: 0.25em;
    color: #f8fafc; 
    text-transform: uppercase;
  }

  #wrap { 
    padding: 20px; 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: calc(100vh - 100px); 
  }

  #state { 
    font-size: 18px; 
    font-weight: 500; 
    margin: 0 0 20px; 
    color: #e2e8f0; 
    letter-spacing: 0.3px;
  }

  #cache { 
    font-size: 13px; 
    color: #64748b; 
    margin: 20px 0 0; 
    min-height: 16px; 
    transition: color 0.3s ease;
  }
  #cache.cacheok { color: #34d399; }

  .ok { color: #34d399; font-weight: 600; } 
  .bad { color: #f87171; font-weight: 600; } 
  .warn { color: #fbbf24; font-weight: 600; }
  
  /* Modern glassmorphism box */
  #det {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 30px;
      border-radius: 14px;
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      display: inline-block;
      letter-spacing: 0.3px;
      line-height: 1.6;
      text-align: left;
  }
  #det b { color: #f1f5f9; font-weight: 600; }

  /* Modern minimalist button with bright gradient */
  #jb-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 15px 42px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.8px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #jb-btn:not(:disabled):hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 14px 30px -5px rgba(37, 99, 235, 0.6);
      transform: translateY(-2px);
  }

  #jb-btn:not(:disabled):active {
      transform: translateY(0);
      box-shadow: 0 6px 15px -3px rgba(37, 99, 235, 0.4);
  }

  /* Elegant disabled state */
  #jb-btn:disabled {
      background: rgba(30, 41, 59, 0.5);
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.03);
      opacity: 0.7;
  }

  #footer {
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      background: rgba(15, 23, 42, 0.4);
      letter-spacing: 0.3px;
  }

  #footer b {
      color: #94a3b8;
  }

  .hidden {
      display: none !important;
  }
</style>
</head>
<body>
<div id="brand">
  <b>PS4 HEN LOADER</b>
</div>

<div id="wrap">
  <div id="state">Checking system and cache...</div>
  <div id="det">Firmware: Loading...<br>Offline Ready: Checking...</div>
  
  <!-- Nueva casilla para activar/desactivar el log -->
  <div style="margin-bottom: 20px; font-size: 14px; color: #94a3b8; display: flex; align-items: center; gap: 8px; cursor: pointer;">
    <input type="checkbox" id="chk-log" style="width: 16px; height: 16px; accent-color: #2563eb; cursor: pointer;">
    <label for="chk-log" style="cursor: pointer;">Mostrar log en pantalla</label>
  </div>

  <div>
    <!-- Jailbreak button (disabled by default on load) -->
    <button id="jb-btn" disabled>Jailbreak</button>
  </div>
  <div id="cache"></div>
</div>

<div id="footer">
    Original idea by <b>&nbsp;raw13g&nbsp;</b> • Restructured by <b>&nbsp;Evilnat</b>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var jbBtn = document.getElementById("jb-btn");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    
    var params = new URLSearchParams(location.search);
    
    // Restricted strictly to 13.02, 13.50, and 13.52
    var SUPPORTED = { 1302: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    
    // Function to update the details box with Offline Ready status
    function updateDetails(offlineStatus) {
        var fwText = "Firmware: <b>" + (key || "Unknown") + "</b> " + (supported ? "<span class='ok'>&bull; Supported</span>" : "<span class='bad'>&bull; Not supported</span>");
        var offlineText = "Offline Ready: <b>" + offlineStatus + "</b>";
        detEl.innerHTML = fwText + "<br>" + offlineText;
    }

    updateDetails("Checking...");

    var target = "jb.html" + location.search;

    var chkLog = document.getElementById("chk-log");
    function go() { 
        setState("Loading jailbreak...", "warn"); 
        
        // Comprobamos si la casilla está marcada
        var showLog = chkLog && chkLog.checked ? "&log=1" : "";
        var finalTarget = "jb.html" + location.search + (location.search ? "&" : "?") + showLog.replace("?", "");
        
        location.replace(finalTarget); 
    }

    // If the firmware is NOT supported, block permanently
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        setCache("The exploit is not compatible with this version");
        updateDetails("Not available");
        jbBtn.disabled = true;
        return;
    }

    function enableButton(msg, offlineReadyText) {
        setState(msg, "warn");
        updateDetails(offlineReadyText);
        jbBtn.disabled = false; 
        jbBtn.onclick = function() {
            jbBtn.disabled = true;
            go();
        };
    }

    function handleUpdateReady() {
        try { ac.swapCache(); } catch (e) {}
        setCache("Update downloaded", true);
        setState("UPDATE READY", "warn");
        updateDetails("Yes (Updated)");
        jbBtn.disabled = false;
        jbBtn.onclick = function () { location.reload(); };
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        enableButton("System ready", "N/A");
    } else if (!navigator.onLine) {
        setCache("Offline mode -- from cache", true);
        enableButton("System ready", "Yes (Offline active)");
    } else if (ac.status === ac.IDLE) {
        setCache("Cache ready", true);
        enableButton("System ready", "Yes (Cache ready)");
    } else if (ac.status === ac.UPDATEREADY) {
        handleUpdateReady();
    } else {
        setCache("Checking cache...");
        ac.addEventListener("downloading", function () { 
            setCache("Downloading offline cache (first run)..."); 
            updateDetails("Downloading...");
        }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("Cache " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("Saved to offline cache", true);
            enableButton("System ready", "Yes (Saved)");
        }, false);
        ac.addEventListener("updateready", handleUpdateReady, false);
        ac.addEventListener("noupdate", function () {
            setCache("Cache up to date -- offline ready", true);
            enableButton("System ready", "Yes (Up to date)");
        }, false);
        ac.addEventListener("error", function () {
            setCache("Cache unavailable");
            enableButton("Ready to run (no cache)", "No (Network error)");
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("Cache obsolete");
            enableButton("Ready to run", "Obsolete");
        }, false);
    }
})();
</script>
</body>
</html>
