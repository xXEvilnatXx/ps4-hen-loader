<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 HEN LOADER</title>
<style>
  html, body { margin:0; padding:0; background:#242629; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; height:100%; }
  #wrap { padding:30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 46px); box-sizing: border-box; }
  #state { font-size:20px; font-weight:600; margin:0 0 15px; color: #e6ebf2; }
  #cache { font-size:12px; color:#5c6672; margin:15px 0 0; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  
  #brand { text-align:center; padding:10px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }

  /* Estilos del círculo girando (loader) */
  .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      margin: -75px 0 0 -75px;
      border: 10px solid #1f1e1e;
      border-radius: 50%;
      border-top: 10px solid #044595;
      border-left: 10px solid #044595;
      width: 120px;
      height: 120px;
      animation: spin 1s linear infinite;
  }

  @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
  }

  /* Recuadro moderno para la versión del firmware */
  #det {
      background: #1b1d20;
      border: 1px solid #2f3338;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 18px;
      color: #b8b8b8;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: inline-block;
  }
  #det b { color: #ffffff; font-weight: 600; }

  /* Botón moderno para Jailbreak */
  #jb-btn {
      background: linear-gradient(135deg, #044595, #065cb8);
      color: #ffffff;
      border: none;
      padding: 14px 36px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(4, 69, 149, 0.4);
      transition: all 0.2s ease;
  }

  #jb-btn:hover {
      background: linear-gradient(135deg, #065cb8, #0871ea);
      box-shadow: 0 6px 20px rgba(4, 69, 149, 0.6);
      transform: translateY(-2px);
  }

  #jb-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(4, 69, 149, 0.4);
  }

  .hidden {
      display: none !important;
  }
</style>
</head>
<body>
<div id="brand">
  <b>PS4 HEN LOADER</b>
</div>

<!-- Círculo girando -->
<div id="loader" class="loader"></div>

<div id="wrap">
  <div id="state">Detectando sistema...</div>
  <div id="det">Firmware: Cargando...</div>
  <div>
    <!-- Botón moderno de Jailbreak -->
    <button id="jb-btn" class="hidden">Jailbreak</button>
  </div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var loaderEl = document.getElementById("loader");
    var jbBtn = document.getElementById("jb-btn");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    
    var params = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    
    // Mostrar la versión real dentro del recuadro
    detEl.innerHTML = "Firmware: <b>" + (key || "Desconocida") + "</b>"
        + (supported ? " <span class='ok'>&bull; Soportado</span>"
                     : " <span class='bad'>&bull; No soportado</span>");

    var target = "jb.html" + location.search;
    function go() { 
        loaderEl.style.display = "block";
        setState("Cargando jailbreak...", "warn"); 
        location.replace(target); 
    }

    // Si el firmware NO es soportado, bloqueamos la ejecución y ocultamos el botón
    if (!supported) {
        loaderEl.style.display = "none";
        setState("FIRMWARE NO SOPORTADO", "bad");
        setCache("El exploit no es compatible con esta versión.");
        return; // Se detiene aquí, impidiendo que el botón aparezca o funcione
    }

    jbBtn.onclick = function() {
        jbBtn.classList.add("hidden");
        go();
    };

    function showButton(msg) {
        loaderEl.style.display = "none";
        setState(msg, "warn");
        jbBtn.classList.remove("hidden");
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        jbBtn.classList.remove("hidden");
        jbBtn.onclick = function() {
            jbBtn.classList.add("hidden");
            action();
        };
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        showButton("Sistema listo");
    } else if (!navigator.onLine) {
        setCache("Modo offline -- desde caché", true);
        showButton("Sistema listo");
    } else if (ac.status === ac.IDLE) {
        setCache("Caché lista", true);
        showButton("Sistema listo");
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("Actualización descargada", true);
        waitForTap("ACTUALIZACIÓN LISTA -- Pulsa para recargar", function () { location.reload(); });
    } else {
        setCache("Comprobando caché...");
        ac.addEventListener("downloading", function () { setCache("Descargando caché offline (primer uso)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("Caché " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("Guardado en caché offline", true);
            showButton("Sistema listo");
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("Actualización descargada", true);
            waitForTap("ACTUALIZACIÓN LISTA -- Pulsa para recargar", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("Caché al día -- listo offline", true);
            showButton("Sistema listo");
        }, false);
        ac.addEventListener("error", function () {
            setCache("Caché no disponible");
            waitForTap("Error en caché -- Pulsa para ejecutar de todos modos", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("Caché obsoleta");
            waitForTap("Caché obsoleta -- Pulsa para ejecutar", go);
        }, false);
    }
})();
</script>
</body>
</html>
