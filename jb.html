<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 HEN LOADER</title>
    <style>
      * { box-sizing: border-box; }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at center, #161e29 0%, #0d121a 100%);
        color: #cbd5e1;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      
      /* Cabecera idéntica a index.html */
      #brand { 
        text-align: center; 
        padding: 16px 20px; 
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      #brand::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: #34d399;
        border-radius: 50%;
        box-shadow: 0 0 8px #34d399;
      }

      #brand b { 
        font-size: 14px; 
        font-weight: 700; 
        letter-spacing: 0.25em;
        color: #f8fafc; 
        text-transform: uppercase;
      }

      /* Spinner de carga original de jb.html */
      #spin {
        position: fixed;
        left: 50%;
        top: 50%;
        margin: -75px 0 0 -75px;
        border: 10px solid #1f1e1e;
        border-radius: 50%;
        border-top: 10px solid #044595;
        border-left: 10px solid #044595;
        width: 120px;
        height: 120px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #msg {
	    position: fixed;
	    top: 50%;
	    left: 50%;
	    transform: translate(-50%, -50%);
	    text-align: center;
	    font-size: 18px;
	    letter-spacing: 1px;
	    padding: 20px 40px;
	    border-radius: 14px;
	    background: rgba(30, 41, 59, 0.75);
	    backdrop-filter: blur(12px);
	    -webkit-backdrop-filter: blur(12px);
	    border: 1px solid rgba(255, 255, 255, 0.08);
	    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
	    display: none;
	    z-index: 100;
	  }

      #wrap {
        padding: 0;
        height: calc(100vh - 100px);
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin,
      body.fail #spin {
        display: none;
      }
      
      body.fail #msg {
	    display: block;
	    color: #f87171; /* Rojo suave para error / Restart */
	    font-weight: 600;
	  }
      
      body.done #msg {
	    display: block;
	    color: #34d399; /* Verde brillante para DONE */
	    font-weight: 700;
	  }

      /* Estilos para el log de depuración */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 20px;
        height: calc(100vh - 45px); /* Ajustado para ocupar toda la pantalla menos el footer */
        display: flex;
        flex-direction: column;
      }
      body.log #state {
        display: block;
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 15px;
        text-align: left;
        color: #e2e8f0;
        letter-spacing: 0.3px;
      }
      body.log #out {
        display: block;
        flex-grow: 1;
        white-space: pre-wrap;
        font: 13px/1.5 Consolas, Monaco, monospace;
        
        /* Fondo idéntico al radial-gradient del body / círculo girando, sin bordes ni sombras de caja */
        background: radial-gradient(circle at center, #161e29 0%, #0d121a 100%);
        border: none;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        
        border-radius: 0;
        padding: 0;
        overflow-y: auto;
        text-align: left;
        color: #94a3b8;
      }

      /* Footer idéntico a index.html (sin position fixed para mantener la misma estructura) */
      #footer {
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #64748b;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        background: rgba(15, 23, 42, 0.4);
        letter-spacing: 0.3px;
      }

      #footer b {
        color: #94a3b8;
      }

      .ok { color: #7fd0a0; }
      .bad { color: #d08a7f; }
      .warn { color: #d8c07f; }
      .safe { color: #7fd0a0; }
      .danger { color: #d08a7f; }
      code { color: #9fb3d0; }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>PS4 HEN LOADER</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <div id="footer">
      Original idea by <b>&nbsp;raw13g&nbsp;</b> • Restructured by <b>&nbsp;Evilnat</b>
    </div>
    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
