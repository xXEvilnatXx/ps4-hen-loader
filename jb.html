<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 HEN LOADER</title>
    <style>
      * { box-sizing: border-box; }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: radial-gradient(circle at center, #161e29 0%, #0d121a 100%);
        color: #cbd5e1;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #brand {
        text-align: center;
        padding: 16px 20px;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      #brand::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: #34d399;
        border-radius: 50%;
        box-shadow: 0 0 8px #34d399;
      }

      #brand b {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.25em;
        color: #f8fafc;
        text-transform: uppercase;
      }

      /* Spinner moderno idéntico al de index.html */
      #spin {
        position: fixed;
        left: 50%;
        top: 50%;
        margin: -75px 0 0 -75px;
        border: 10px solid #1f1e1e;
        border-radius: 50%;
        border-top: 10px solid #044595;
        border-left: 10px solid #044595;
        width: 120px;
        height: 120px;
        animation: spin 1s linear infinite;
        z-index: 10;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 1px;
        display: none;
        z-index: 10;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      /* Control de estados cuando el exploit finaliza o falla */
      body.done #spin {
        display: none !important;
      }
      body.fail #spin {
        display: none !important;
      }
      body.fail #msg {
        display: block !important;
        color: #f87171;
      }
      body.done #msg {
        display: block !important;
        color: #34d399 !important;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ?log=1 -- el registro de pasos completo por si se activa */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }

      #footer {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 45px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
          color: #64748b;
          border-top: 1px solid rgba(255, 255, 255, 0.04);
          background: rgba(15, 23, 42, 0.4);
          letter-spacing: 0.3px;
      }

      #footer b {
          color: #94a3b8;
      }

      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>PS4 HEN LOADER</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Done</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <div id="footer">
      Idea original de <b>&nbsp;raw13g&nbsp;</b> • Reestructurado por <b>&nbsp;Evilnat</b>
    </div>
    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
