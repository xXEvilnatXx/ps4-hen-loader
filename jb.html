<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 HEN LOADER</title>
    <style>
      * { box-sizing: border-box; }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: radial-gradient(circle at center, #161e29 0%, #0d121a 100%);
        color: #cbd5e1;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      
      /* Cabecera profesional y moderna */
      #brand { 
        text-align: center; 
        padding: 16px 20px; 
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      #brand::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: #34d399;
        border-radius: 50%;
        box-shadow: 0 0 8px #34d399;
      }

      #brand b { 
        font-size: 14px; 
        font-weight: 700; 
        letter-spacing: 0.25em;
        color: #f8fafc; 
        text-transform: uppercase;
      }

      /* Spinner moderno idéntico al de index.html */
      #spin {
        position: fixed;
        left: 50%;
        top: 50%;
        margin: -75px 0 0 -75px;
        border: 10px solid #1f1e1e;
        border-radius: 50%;
        border-top: 10px solid #34d399;
        border-left: 10px solid #34d399;
        width: 120px;
        height: 120px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Mensaje oculto por defecto para que no dibuje ningún rectángulo vacío */
      #msg {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 20px 35px;
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      #wrap {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 100px);
      }
      
      #state {
        font-size: 18px;
        font-weight: 500;
        color: #e2e8f0;
        margin-bottom: 20px;
        display: none;
      }

      /* Estados controlados por jb.js al finalizar */
      body.done #spin,
      body.fail #spin {
        display: none !important;
      }
      
      body.fail #msg {
        display: block !important;
        color: #f87171 !important; /* Rojo elegante para error */
      }
      
      body.done #msg {
        display: block !important;
        color: #34d399 !important; /* Verde brillante para éxito */
        font-weight: 700;
        letter-spacing: 1px;
      }

      /* Log de depuración (?log=1) */
      body.log #spin,
      body.log #msg {
        display: none !important;
      }
      body.log #wrap {
        padding: 14px 18px;
        display: block;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      #out {
        display: none;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 16px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }

      /* Footer idéntico al de index.html */
      #footer {
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #64748b;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        background: rgba(15, 23, 42, 0.4);
        letter-spacing: 0.3px;
      }

      #footer b {
        color: #94a3b8;
      }

      .ok { color: #34d399; }
      .bad { color: #f87171; }
      .warn { color: #fbbf24; }
      .safe { color: #34d399; }
      .danger { color: #f87171; }
      code { color: #9fb3d0; }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>PS4 HEN LOADER</b>
    </div>
    
    <div id="spin"></div>
    <div id="msg"></div>
    
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    
    <div id="footer">
      Original idea by <b>&nbsp;raw13g&nbsp;</b> • Restructured by <b>&nbsp;Evilnat</b>
    </div>

    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
